<style>
:root{--red:#e5232b;--dark:#14202b;--muted:#66717c}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--dark);background:linear-gradient(125deg,#f7fafc 0%,#eef3f7 38%,#fff7f7 68%,#eef4f8 100%);background-size:240% 240%;animation:bgFlow 18s ease-in-out infinite;overflow-x:hidden}body:before,body:after{content:"";position:fixed;width:260px;height:260px;border-radius:50%;pointer-events:none;filter:blur(55px);z-index:-1}body:before{left:-120px;top:12%;background:rgba(229,35,43,.10);animation:floatGlow1 11s ease-in-out infinite alternate}body:after{right:-130px;bottom:8%;background:rgba(229,35,43,.07);animation:floatGlow2 14s ease-in-out infinite alternate}@keyframes bgShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}@keyframes floatGlow1{to{transform:translate(90px,110px) scale(1.25)}}@keyframes floatGlow2{to{transform:translate(-100px,-80px) scale(1.18)}}
body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--dark);background:#eef2f6}
.wrap{position:relative;z-index:3;min-height:100vh;padding:20px;display:flex;justify-content:center;align-items:flex-start;box-sizing:border-box;}animation:pageIn .7s cubic-bezier(.22,1,.36,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.card{animation:cardIn .8s .05s cubic-bezier(.22,1,.36,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(24px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.hero:before{animation:orb1 7s ease-in-out infinite alternate}.hero:after{animation:orb2 8s ease-in-out infinite alternate}
@keyframes orb1{to{transform:translate(-18px,16px) scale(1.12)}}@keyframes orb2{to{transform:translate(16px,-12px) scale(1.08)}}
.official-logo{animation:logoFloat 3.8s ease-in-out infinite}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.scan{animation:scanPulse 2.8s ease-in-out infinite}
@keyframes scanPulse{0%,100%{transform:scale(1);box-shadow:inset 0 1px 0 #fff,0 8px 20px rgba(20,32,43,.08)}50%{transform:scale(1.015);box-shadow:inset 0 1px 0 #fff,0 11px 26px rgba(229,35,43,.13)}}
.grid .btn{opacity:0;animation:btnIn .55s cubic-bezier(.22,1,.36,1) forwards}
.grid .btn:nth-child(1){animation-delay:.18s}.grid .btn:nth-child(2){animation-delay:.25s}.grid .btn:nth-child(3){animation-delay:.32s}.grid .btn:nth-child(4){animation-delay:.39s}.grid .btn:nth-child(5){animation-delay:.46s}.grid .btn:nth-child(6){animation-delay:.53s}
@keyframes btnIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.btn{transition:transform .22s cubic-bezier(.22,1,.36,1),box-shadow .22s ease}
.btn:hover{transform:translateY(-6px) scale(1.015)}
.btn:active{transform:translateY(-1px) scale(.985)}
.btn:hover .icon{transform:rotate(-4deg) scale(1.06)}
.icon{transition:transform .25s cubic-bezier(.22,1,.36,1)}
.arrow{transition:transform .22s ease}.btn:hover .arrow{transform:translateX(3px)}
.footer{animation:fadeUp .8s .65s both}@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
.card{width:min(100%,560px);max-width:560px;overflow:hidden;border-radius:30px;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);box-shadow:0 24px 70px rgba(20,32,43,.16);border:1px solid rgba(255,255,255,.8)}
.hero{position:relative;padding:22px 22px 25px;background:linear-gradient(135deg,#fff,#f8fafc);overflow:hidden}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(2px)}
.hero:before{width:180px;height:180px;background:rgba(229,35,43,.10);right:-70px;top:-70px}.hero:after{width:120px;height:120px;background:rgba(229,35,43,.07);left:-55px;bottom:-65px}
.logo{position:relative;z-index:1;margin:0 auto 12px;width:100%;display:flex;align-items:center;justify-content:center}.official-logo{display:block;width:min(290px,82vw);max-height:88px;object-fit:contain;filter:drop-shadow(0 7px 12px rgba(20,32,43,.10))}
.logo-mark{width:58px;height:58px;border-radius:18px 18px 18px 7px;background:linear-gradient(145deg,#f02b35,#b90f18);box-shadow:8px 10px 18px rgba(185,15,24,.28),inset 2px 2px 5px rgba(255,255,255,.35);position:relative;transform:rotate(-7deg)}
.logo-mark:before{content:"A";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:42px;font-weight:900;font-family:Arial,sans-serif;transform:rotate(7deg)}
.logo-text{text-align:left;line-height:.95}.logo-text strong{display:block;font-size:30px;letter-spacing:-1.2px;color:#14202b}.logo-text span{display:block;font-size:12px;letter-spacing:2px;color:#7b151b;font-weight:800;margin-top:5px}
.kicker{text-align:center;font-size:11px;letter-spacing:3px;font-weight:800;color:#8b171d;text-transform:uppercase}
h1{text-align:center;margin:7px 0 4px;font-size:28px;letter-spacing:-.7px}.sub{text-align:center;color:var(--muted);margin:0;font-size:14px}
.scan{margin:18px 18px 2px;padding:12px 15px;border-radius:16px;background:linear-gradient(135deg,#fff,#f3f6f9);box-shadow:inset 0 1px 0 #fff,0 8px 20px rgba(20,32,43,.08);text-align:center;font-weight:700}
.grid{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.btn{appearance:none;-webkit-appearance:none;font:inherit;text-align:left;cursor:pointer;position:relative;min-height:142px;padding:18px 14px;text-decoration:none;color:var(--dark);border-radius:22px;background:linear-gradient(145deg,#fff,#edf1f5);box-shadow:8px 10px 20px rgba(20,32,43,.12),-5px -5px 12px rgba(255,255,255,.95);border:1px solid rgba(255,255,255,.9);display:flex;flex-direction:column;justify-content:space-between;transition:.18s}
.btn:hover{transform:translateY(-3px);box-shadow:10px 15px 28px rgba(20,32,43,.16)}
.icon{width:55px;height:55px;border-radius:17px;display:grid;place-items:center;font-size:28px;background:linear-gradient(145deg,#fff,#e7ebef);box-shadow:inset 2px 2px 5px rgba(255,255,255,.9),5px 7px 12px rgba(20,32,43,.13)}
.title{font-size:15px;font-weight:800;margin-top:10px;line-height:1.15}.small{font-size:11px;color:var(--muted);margin-top:4px}
.arrow{position:absolute;right:12px;bottom:12px;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:var(--red);color:#fff;font-weight:900;box-shadow:0 5px 10px rgba(229,35,43,.3)}
.footer{padding:3px 20px 22px;text-align:center;color:#8a949d;font-size:11px}.brandline{height:4px;width:65px;margin:0 auto 10px;border-radius:20px;background:linear-gradient(90deg,#b81820,#e5232b,#f35b61)}
@media(max-width:700px){.wrap{padding:14px 10px;align-items:flex-start}.card{max-width:440px}.hero{padding:22px 20px 25px}h1{font-size:28px}.scan{margin:18px 18px 2px}.grid{padding:18px;gap:14px}.btn{min-height:142px;padding:18px 14px}.footer{padding:3px 20px 22px}}
@media(max-width:360px){.grid{gap:10px;padding:13px}.btn{min-height:132px}.hero{padding-left:14px;padding-right:14px}}

.lab-motion{display:none;position:fixed;inset:0;z-index:1;overflow:hidden;pointer-events:none;background:transparent;opacity:0}
.lab-motion:before{content:"";position:absolute;inset:-30%;background:
radial-gradient(circle at 18% 30%,rgba(229,35,43,.18) 0 3px,transparent 4px),
radial-gradient(circle at 70% 22%,rgba(229,35,43,.14) 0 4px,transparent 5px),
radial-gradient(circle at 78% 72%,rgba(229,35,43,.12) 0 3px,transparent 4px),
linear-gradient(90deg,transparent 49.5%,rgba(20,32,43,.035) 50%,transparent 50.5%),
linear-gradient(transparent 49.5%,rgba(20,32,43,.035) 50%,transparent 50.5%);
background-size:210px 210px,280px 280px,240px 240px,80px 80px,80px 80px;
animation:labDrift 22s linear infinite}
.lab-motion:after{content:"";position:absolute;width:42vw;height:42vw;min-width:260px;min-height:260px;right:-12vw;top:8vh;border-radius:50%;border:1px solid rgba(229,35,43,.16);box-shadow:0 0 0 45px rgba(229,35,43,.035),0 0 0 90px rgba(229,35,43,.025);animation:labPulse 8s ease-in-out infinite}
@keyframes labDrift{from{transform:translate3d(0,0,0) rotate(0deg)}to{transform:translate3d(-80px,50px,0) rotate(3deg)}}
@keyframes labPulse{0%,100%{transform:scale(.94);opacity:.55}50%{transform:scale(1.08);opacity:1}}
.lab-orb{display:none;position:fixed;z-index:2;border-radius:50%;background:rgba(255,255,255,.5);border:1px solid rgba(229,35,43,.14);box-shadow:inset 0 0 18px rgba(255,255,255,.8),0 8px 24px rgba(20,32,43,.06);z-index:-1;pointer-events:none}
.lab-orb.one{width:90px;height:90px;left:7%;bottom:12%;animation:orbFloat 9s ease-in-out infinite}
.lab-orb.two{width:46px;height:46px;right:14%;top:34%;animation:orbFloat 6s 1s ease-in-out infinite reverse}
@keyframes orbFloat{0%,100%{transform:translateY(0) translateX(0)}50%{transform:translateY(-34px) translateX(18px)}}

@keyframes bgFlow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
body:before,body:after{content:"";position:fixed;z-index:0;pointer-events:none;border-radius:50%;filter:blur(8px);opacity:.5}

@keyframes blobA{to{transform:translate(90px,70px) scale(1.18)}}

.wrap:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(circle at 12% 22%,rgba(229,35,43,.16) 0 3px,transparent 4px),radial-gradient(circle at 82% 18%,rgba(229,35,43,.13) 0 2px,transparent 3px),radial-gradient(circle at 70% 78%,rgba(72,132,180,.14) 0 3px,transparent 4px),radial-gradient(circle at 28% 84%,rgba(229,35,43,.10) 0 2px,transparent 3px);animation:particleDrift 16s linear infinite}
@keyframes particleDrift{to{transform:translate3d(0,-18px,0)}}
.card{position:relative;transition:transform .45s cubic-bezier(.22,1,.36,1),box-shadow .45s ease}
.card:hover{transform:translateY(-5px);box-shadow:0 30px 85px rgba(20,32,43,.20)}
.official-logo{animation:logoFloat 4.5s ease-in-out infinite}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.scan{animation:scanPulse 3.2s ease-in-out infinite}
@keyframes scanPulse{0%,100%{box-shadow:0 8px 20px rgba(20,32,43,.07)}50%{box-shadow:0 10px 28px rgba(229,35,43,.13)}}
.btn{transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s ease,background .35s ease}
.btn:hover{transform:translateY(-7px) scale(1.012);box-shadow:0 18px 32px rgba(20,32,43,.13)}
.btn .icon{transition:transform .4s cubic-bezier(.22,1,.36,1)}

.wrap:before{background-image:
